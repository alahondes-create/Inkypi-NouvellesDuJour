<div class="form-group">
    <label for="backend">Moteur de synthèse (IA)</label>
    <select id="backend" name="backend" class="form-control">
        <option value="ollama">IA locale sur le Raspberry Pi (Ollama)</option>
        <option value="mistral">Mistral (cloud, nécessite MISTRAL_API_KEY)</option>
    </select>
    <small class="text-muted">
        Le moteur non sélectionné reste utilisé en secours si le premier échoue.
    </small>
</div>

<div class="form-group">
    <label for="ollama_url">Ollama : URL (si IA locale)</label>
    <input
        type="text"
        id="ollama_url"
        name="ollama_url"
        value="http://127.0.0.1:11434"
        class="form-control"
        placeholder="http://127.0.0.1:11434">
</div>

<div class="form-group">
    <label for="ollama_model">Ollama : modèle (si IA locale)</label>
    <input
        type="text"
        id="ollama_model"
        name="ollama_model"
        value="qwen2.5:3b"
        class="form-control"
        placeholder="qwen2.5:3b">
    <small class="text-muted">
        Modèles recommandés — Raspberry Pi 8 Go : qwen2.5:3b ;
        4 Go : gemma2:2b ou qwen2.5:1.5b ; ne pas dépasser 3b.
    </small>
</div>

<div class="form-group">
    <label for="word_count">Nombre de mots</label>
    <input
        type="number"
        id="word_count"
        name="word_count"
        min="100"
        max="2000"
        value="400"
        class="form-control">
</div>

<div class="form-group">
    <label for="style">Style littéraire</label>
    <select id="style" name="style" class="form-control">
        <option value="journalistique">Journalistique</option>
        <option value="Victor Hugo">Victor Hugo</option>
        <option value="Flaubert">Gustave Flaubert</option>
        <option value="Zola">Émile Zola</option>
        <option value="Maupassant">Guy de Maupassant</option>
    </select>
</div>

<div class="form-group">
    <label for="topics">Centres d'intérêt (séparés par des virgules)</label>
    <input
        type="text"
        id="topics"
        name="topics"
        value="technologie, économie"
        class="form-control"
        placeholder="IA, espace, économie, sciences">
</div>

<div class="form-group">
    <label>
        <input type="checkbox" id="kids_filter" name="kids_filter">
        Filtre enfant
    </label>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    if (typeof pluginSettings !== "undefined") {
        document.getElementById("backend").value = pluginSettings.backend || "ollama";
        document.getElementById("ollama_url").value = pluginSettings.ollama_url || "http://127.0.0.1:11434";
        document.getElementById("ollama_model").value = pluginSettings.ollama_model || "qwen2.5:3b";
        document.getElementById("word_count").value = pluginSettings.word_count || 400;
        document.getElementById("style").value = pluginSettings.style || "journalistique";
        document.getElementById("topics").value = pluginSettings.topics || "";
        document.getElementById("kids_filter").checked =
            pluginSettings.kids_filter === true ||
            pluginSettings.kids_filter === "on";
    }
});
</script>
